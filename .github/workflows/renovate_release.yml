name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.renovate-release.outputs.tag_name }}
    permissions:
      contents: write
    steps:
      - id: renovate-release
        uses: infrabits/ci-create-renovate-release@9438f2b15384e449fa8337fdb9c4ba499c51ece6 # v1.4.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
