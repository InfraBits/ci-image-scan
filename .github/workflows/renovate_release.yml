name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.renovate-release.outputs.tag_name }}
    permissions:
      contents: write
    steps:
      - id: renovate-release
        uses: infrabits/ci-create-renovate-release@417c576b658187496f1870bd567bef7f625e002b # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
